<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="ru" font-family="Segoe UI, Arial, sans-serif" data-pptx-page-role="cover">
  <defs>
    <radialGradient id="bgField" cx="0.72" cy="0.5" r="0.75">
      <stop offset="0%" stop-color="#16223A"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </radialGradient>
    <radialGradient id="muscleGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FF5A6E" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FF5A6E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="muscleBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C81E3A"/>
      <stop offset="100%" stop-color="#FF5A6E"/>
    </linearGradient>
    <linearGradient id="accentRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF5A6E"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="url(#bgField)"/>

  <g id="title-block" data-pptx-bounds="72 130 650 450">
    <text x="80" y="170" font-family="Consolas, Courier New, monospace" font-size="18" font-weight="bold" fill="#38BDF8">НАУЧНЫЕ ОТКРЫТИЯ XXI ВЕКА · ЯПОНИЯ</text>
    <text font-size="58" font-weight="bold" fill="#F1F5F9"><tspan x="80" y="262">Робот-андроид</tspan><tspan x="80" dy="70">с <tspan fill="#FF5A6E">живыми мышцами</tspan></tspan></text>
    <rect x="80" y="370" width="96" height="4" fill="url(#accentRule)"/>
    <text font-size="28" fill="#CBD5E1"><tspan x="80" y="424">Как японские учёные заставили живые</tspan><tspan x="80" dy="40">клетки двигать механический палец</tspan></text>
    <text x="80" y="560" font-family="Consolas, Courier New, monospace" font-size="18" fill="#94A3B8">Токийский университет · 2018</text>
  </g>

  <g id="finger-diagram" data-pptx-bounds="740 140 500 520">
    <circle cx="990" cy="400" r="250" fill="url(#muscleGlow)"/>
    <g id="skeleton" fill="#1E293B" stroke="#64748B" stroke-width="2">
      <rect x="780" y="430" width="230" height="64" rx="12"/>
      <rect x="1030" y="440" width="190" height="44" rx="22" transform="rotate(-40 1030 462)"/>
    </g>
    <circle cx="1030" cy="462" r="24" fill="#0B1220" stroke="#38BDF8" stroke-width="4"/>
    <g id="muscle-flexor">
