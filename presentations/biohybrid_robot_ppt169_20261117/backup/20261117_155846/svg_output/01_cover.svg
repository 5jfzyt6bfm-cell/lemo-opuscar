      <g stroke="#FFE4E6" stroke-opacity="0.55" stroke-width="1.5">
        <line x1="822" y1="403" x2="822" y2="417"/><line x1="840" y1="403" x2="840" y2="417"/><line x1="858" y1="403" x2="858" y2="417"/><line x1="876" y1="403" x2="876" y2="417"/><line x1="894" y1="403" x2="894" y2="417"/><line x1="912" y1="403" x2="912" y2="417"/><line x1="930" y1="403" x2="930" y2="417"/><line x1="948" y1="403" x2="948" y2="417"/><line x1="966" y1="403" x2="966" y2="417"/><line x1="984" y1="403" x2="984" y2="417"/>
      </g>
      <line x1="1008" y1="410" x2="1062" y2="406" stroke="#FF5A6E" stroke-width="3"/>
    </g>
    <g id="muscle-extensor">
      <rect x="800" y="502" width="210" height="24" rx="12" fill="#FF5A6E" fill-opacity="0.4"/>
      <g stroke="#FFE4E6" stroke-opacity="0.35" stroke-width="1.5">
        <line x1="822" y1="507" x2="822" y2="521"/><line x1="840" y1="507" x2="840" y2="521"/><line x1="858" y1="507" x2="858" y2="521"/><line x1="876" y1="507" x2="876" y2="521"/><line x1="894" y1="507" x2="894" y2="521"/><line x1="912" y1="507" x2="912" y2="521"/><line x1="930" y1="507" x2="930" y2="521"/><line x1="948" y1="507" x2="948" y2="521"/><line x1="966" y1="507" x2="966" y2="521"/><line x1="984" y1="507" x2="984" y2="521"/>
      </g>
      <line x1="1008" y1="514" x2="1046" y2="482" stroke="#FF5A6E" stroke-opacity="0.6" stroke-width="3"/>
    </g>
    <circle cx="1206" cy="318" r="20" fill="none" stroke="#FBBF24" stroke-width="6"/>
    <g id="diagram-labels" font-size="18">
      <text x="800" y="384" font-weight="bold" fill="#FF5A6E">живая мышца</text>
      <text x="800" y="562" fill="#94A3B8">каркас: металл и пластик</text>
      <line x1="1044" y1="484" x2="1086" y2="548" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="1092" y="562" fill="#38BDF8">сустав</text>
      <text x="1230" y="276" text-anchor="end" fill="#FBBF24">переносит предметы</text>
