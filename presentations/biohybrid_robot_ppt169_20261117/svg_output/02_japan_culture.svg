<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="ru" font-family="Segoe UI, Arial, sans-serif" data-pptx-page-role="content">
  <defs>
    <radialGradient id="bgField" cx="0.72" cy="0.5" r="0.75">
      <stop offset="0%" stop-color="#16223A" />
      <stop offset="100%" stop-color="#0B1220" />
    </radialGradient>
  </defs>
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="url(#bgField)" />

  <g id="header" data-pptx-bounds="72 85 1136 110" font-weight="bold">
    <text x="80" y="110" font-family="Consolas, Courier New, monospace" font-size="18" fill="#38BDF8">ЧТО ОБЩЕГО У ЧАЙНОЙ ЦЕРЕМОНИИ И РОБОТА?</text>
    <text x="80" y="170" font-size="44" fill="#F1F5F9">Наука — тоже часть культуры</text>
  </g>

  <g id="culture-text" data-pptx-bounds="72 240 570 350" font-size="24" fill="#CBD5E1">
    <text><tspan x="80" y="270">Культура каждой страны — это не только</tspan><tspan x="80" dy="36">традиции, искусство и обычаи, но и её</tspan><tspan x="80" dy="36"><tspan font-weight="bold" fill="#F1F5F9">научные достижения</tspan>.</tspan></text>
    <text><tspan x="80" y="400">Япония славится технологической</tspan><tspan x="80" dy="36">культурой и любовью к робототехнике.</tspan></text>
    <text><tspan x="80" y="494">Её инженеры создают устройства,</tspan><tspan x="80" dy="36">которые <tspan font-weight="bold" fill="#FF5A6E">стирают границу между</tspan></tspan><tspan x="80" dy="36"><tspan font-weight="bold" fill="#FF5A6E">живым организмом и техникой</tspan>.</tspan></text>
  </g>

  <g id="culture-stack" data-pptx-bounds="660 205 560 425">
    <g id="p02-culture-brace" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="leftBrace" data-pptx-frame="672 220 28 340" fill="none" stroke="#38BDF8" stroke-width="3">
<path d="M 700 560 A 14 2.33 0 0 1 686 557.67 L 686 392.33 A 14 2.33 0 0 0 672 390 A 14 2.33 0 0 0 686 387.67 L 686 222.33 A 14 2.33 0 0 1 700 220 Z" stroke="none" />
<path d="M 700 560 A 14 2.33 0 0 1 686 557.67 L 686 392.33 A 14 2.33 0 0 0 672 390 A 14 2.33 0 0 0 686 387.67 L 686 222.33 A 14 2.33 0 0 1 700 220" />
</g>
    <g id="row-traditions">
      <rect x="712" y="220" width="500" height="100" rx="14" fill="#131C2E" stroke="#263248" stroke-width="1.5" />
      <use data-icon="tabler-outline/cup" x="740" y="248" width="44" height="44" fill="#94A3B8" stroke-width="2" />
      <text x="806" y="266" font-size="26" font-weight="bold" fill="#F1F5F9">Традиции</text>
      <text x="806" y="296" font-size="18" fill="#94A3B8">чайная церемония, праздники</text>
    </g>
    <g id="row-art">
      <rect x="712" y="340" width="500" height="100" rx="14" fill="#131C2E" stroke="#263248" stroke-width="1.5" />
      <use data-icon="tabler-outline/brush" x="740" y="368" width="44" height="44" fill="#94A3B8" stroke-width="2" />
      <text x="806" y="386" font-size="26" font-weight="bold" fill="#F1F5F9">Искусство</text>
      <text x="806" y="416" font-size="18" fill="#94A3B8">каллиграфия, гравюры, аниме</text>
    </g>
    <g id="row-science">
      <rect x="712" y="460" width="500" height="100" rx="14" fill="#FF5A6E" fill-opacity="0.12" stroke="#FF5A6E" stroke-width="2" />
      <use data-icon="tabler-outline/robot" x="740" y="488" width="44" height="44" fill="#FF5A6E" stroke-width="2" />
      <text x="806" y="506" font-size="26" font-weight="bold" fill="#FF5A6E">Наука и техника</text>
      <text x="806" y="536" font-size="18" fill="#CBD5E1">роботы, электроника, биоинженерия</text>
    </g>
    <text font-size="18" fill="#94A3B8"><tspan x="712" y="596">Чайная церемония и робот —</tspan><tspan x="712" dy="24">проявления одной культуры.</tspan></text>
  </g>
</svg>
